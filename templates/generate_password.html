<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold text-center text-gray-700">Generar Nueva Contraseña</h2>
        <p class="text-gray-500 text-center mb-4">Ingresa tu email para recibir una nueva contraseña</p>
        
        <form id="generatePasswordForm" class="space-y-4">
            <label for="email" class="block text-gray-600">Email</label>
            <input type="email" id="email" class="w-full p-2 border rounded" placeholder="Ingrese su email" required>
            
            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 transition">Generar Contraseña</button>
        </form>
        
        <p id="message" class="text-center text-sm mt-3"></p>
    </div>
    <script type="module" src="{{ url_for('static', filename='js/generate_password.js') }}"></script>
</body>
</html>
