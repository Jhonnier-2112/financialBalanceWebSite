<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecimiento de Contraseña</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .container { max-width: 500px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; }
        h2 { color: #007bff; }
        .password { font-size: 18px; color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Hola, {{ name }} 👋</h2>
        <p>Recibimos una solicitud para restablecer tu contraseña.</p>
        <p><strong>Tu nueva contraseña es:</strong> <span class="password">{{ new_password }}</span></p>
        <p>Si no solicitaste este cambio, ignora este mensaje.</p>
        <hr>
        <p>🔐 Seguridad: Recuerda cambiar tu contraseña después de iniciar sesión.</p>
    </div>
</body>
</html>
