<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" crossorigin="anonymous"></script>
    <style>
        /* Estilos para las notificaciones */
        .toast {
            padding: 12px 16px;
            border-radius: 6px;
            color: rgb(1, 1, 1);
            font-weight: bold;
            animation: fadeInOut 3s ease-in-out;
        }
        .success {
            background-color: #20f628; /* Verde */
        }
        .error {
            background-color: #ecb3b3; /* Rojo */
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(100%); }
            10% { opacity: 1; transform: translateX(0); }
            90% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(100%); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div id="toast-container" class="fixed top-5 right-5 z-50 space-y-2"></div>
    <div class="w-full max-w-md bg-white shadow-lg rounded-lg p-6">
        <h2 class="text-2xl font-bold text-center text-gray-700">Recuperar Contraseña</h2>
        
        <form id="resetPasswordForm" class="mt-4 space-y-4">
            <div>
                <label for="email" class="block text-gray-600 font-medium">Correo Electrónico</label>
                <input type="email" id="email" class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>

            <!-- Contraseña Actual -->
            <div class="relative">
                <label for="current_password" class="block text-gray-600 font-medium">Contraseña Actual</label>
                <input type="password" id="current_password" class="password-input w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg pr-10 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                <button type="button" class="toggle-password absolute right-3 top-10 text-gray-500 hover:text-gray-700">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <!-- Nueva Contraseña -->
            <div class="relative">
                <label for="new_password" class="block text-gray-600 font-medium">Nueva Contraseña</label>
                <input type="password" id="new_password" class="password-input w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg pr-10 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                <button type="button" class="toggle-password absolute right-3 top-10 text-gray-500 hover:text-gray-700">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <!-- Confirmar Nueva Contraseña -->
            <div class="relative">
                <label for="confirm_password" class="block text-gray-600 font-medium">Confirmar Nueva Contraseña</label>
                <input type="password" id="confirm_password" class="password-input w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg pr-10 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                <button type="button" class="toggle-password absolute right-3 top-10 text-gray-500 hover:text-gray-700">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition duration-200">Actualizar Contraseña</button>
        </form>

        <p id="message" class="mt-3 text-center text-sm text-gray-600"></p>
    </div>
<script src="{{ url_for('static', filename='js/reset_password.js') }}"></script>
</body>
</html>
